<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Contador de observaciones</title>
  <style>
    :root{font-family:system-ui,sans-serif;color-scheme:dark}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#101a18;color:#f0faf5}.panel{width:min(90%,420px);padding:32px;border:1px solid #41685c;border-radius:22px;background:#1a2924;text-align:center;box-shadow:0 20px 60px #0005}.eyebrow{color:#7bd5ae;letter-spacing:.12em;font-size:.75rem;font-weight:800}.value{font-size:5rem;font-weight:800;margin:14px}.actions{display:flex;justify-content:center;flex-wrap:wrap;gap:10px}button{padding:11px 16px;border:0;border-radius:10px;background:#72d5ac;color:#10241b;font:inherit;font-weight:750;cursor:pointer}button:focus-visible{outline:3px solid white;outline-offset:3px}.reset{background:#40584e;color:white}
  </style>
</head>
<body>
  <main class="panel">
    <p class="eyebrow">PRÁCTICA DE INTERACCIÓN</p>
    <h1>Observaciones registradas</h1>
    <p id="count" class="value" aria-live="polite">0</p>
    <div class="actions">
      <button id="subtract" type="button">Restar</button>
      <button id="add" type="button">Sumar</button>
      <button id="reset" class="reset" type="button">Reiniciar</button>
    </div>
  </main>
  <script>
    let count=0;
    const display=document.querySelector("#count");
    function update(){display.textContent=String(count);}
    document.querySelector("#add").addEventListener("click",()=>{count+=1;update();});
    document.querySelector("#subtract").addEventListener("click",()=>{count=Math.max(0,count-1);update();});
    document.querySelector("#reset").addEventListener("click",()=>{count=0;update();});
  </script>
</body>
</html>
