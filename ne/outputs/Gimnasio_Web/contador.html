<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contador de series | Fuerza Base</title><style>:root{font-family:system-ui,sans-serif;color-scheme:dark}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#111815;color:#f2f5ef}.panel{width:min(90%,420px);padding:32px;border:1px solid #46544b;border-radius:20px;background:#1a231f;text-align:center}.tag{color:#d5ff4f;letter-spacing:.13em;font-size:.75rem;font-weight:800}.value{font-size:5rem;font-weight:850;margin:12px}.actions{display:flex;justify-content:center;flex-wrap:wrap;gap:10px}button{padding:11px 15px;border:0;border-radius:9px;background:#d5ff4f;color:#202b17;font:inherit;font-weight:750;cursor:pointer}button:focus-visible{outline:3px solid white;outline-offset:3px}.secondary{background:#445349;color:white}</style></head><body><main class="panel"><p class="tag">PRÁCTICA DE INTERACCIÓN</p><h1>Series completadas</h1><p id="number" class="value" aria-live="polite">0</p><div class="actions"><button id="minus" type="button">Restar</button><button id="plus" type="button">Sumar serie</button><button id="reset" class="secondary" type="button">Reiniciar</button></div></main><script>let series=0;const display=document.querySelector("#number");function update(){display.textContent=String(series)}document.querySelector("#plus").addEventListener("click",()=>{series+=1;update()});document.querySelector("#minus").addEventListener("click",()=>{series=Math.max(0,series-1);update()});document.querySelector("#reset").addEventListener("click",()=>{series=0;update()});</script></body></html>
